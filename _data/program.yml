intro: The workshop will feature invited talks, peer-reviewed paper presentations, and a panel discussion. A tentative schedule can be found below.

# Rows with `paper: N` are accepted-paper slots. They render as
# "Accepted Paper N", and pick up the title/presenter from entry N of
# `papers` in _data/accepted-papers.yml once those are filled in.
# Every other row uses `session:` for its label.
schedule:
