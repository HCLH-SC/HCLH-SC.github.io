    session: Welcome and Introductory Remarks (Organizing Committee)
    # 5 min
  - time: 14:05 – 14:30
    session: Invited Talk I
    # 25 min (20 min talk + 5 min Q/A)
  - time: 14:30 – 14:45
    paper: 1
    # 15 min (talk + Q/A + changeover)
  - time: 14:45 – 15:00
    paper: 2
    # 15 min (talk + Q/A + changeover)
  - time: 15:00 – 15:30
    session: Break
    # 30 min
  - time: 15:30 – 15:55
    session: Invited Talk II
    # 25 min (20 min talk + 5 min Q/A)
  - time: 15:55 – 16:10
    paper: 3
    # 15 min (talk + Q/A + changeover)
  - time: 16:10 – 16:25
    paper: 4
    # 15 min (talk + Q/A + changeover)
  - time: 16:25 – 16:40
